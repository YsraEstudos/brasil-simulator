sonar.projectName=Brasil Simulator
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Fora da cobertura: código que só roda com renderizador ou dispositivo (telas React Native, tema, globo em
# tempo de execução no Three.js, SQLite nativo). Os testes rodam em Node e cobrem motor, conteúdo, store e dados.
sonar.coverage.exclusions=src/**/*.tsx,src/app/**,src/hooks/**,src/theme/**,src/constants/**,src/**/*Theme.ts,src/globe/controller.ts,src/globe/r3f.ts,src/globe/shaders.ts,src/globe/tileStore.ts,src/globe/data/**,src/database/openDatabase.ts
